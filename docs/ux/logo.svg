  <!-- Wordmark: Fredoka SemiBold. Para producción, convertir texto a contornos. -->
  <text x="132" y="70" font-family="Fredoka, Nunito, 'Varela Round', sans-serif" font-weight="600" font-size="54" fill="#2A1F2D" letter-spacing="-0.5">Entre Nos</text>
  <text x="134" y="98" font-family="Nunito, 'Varela Round', sans-serif" font-weight="700" font-size="20" fill="#665A6B" letter-spacing="1.5">amigo secreto</text>
