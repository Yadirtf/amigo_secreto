appId: com.entrenos.amigosecreto
---
# Works from any screen: go back to the groups list first.
- repeat:
    times: 4
    while:
      notVisible:
        id: profile-button
    commands:
      - back
- tapOn:
    id: profile-button
- scrollUntilVisible:
    element:
      id: profile-logout
- tapOn:
    id: profile-logout
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 15000
