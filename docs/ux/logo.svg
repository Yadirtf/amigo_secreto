<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 120" width="470" height="120" role="img" aria-labelledby="t">
  <title id="t">Entre Nos – amigo secreto</title>
  <!-- Marca: dos globos de conversación (coral = celebración, verde = confianza) cuya intersección dorada es el secreto "entre nos". -->
