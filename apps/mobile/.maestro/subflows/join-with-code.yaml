# Joins the group whose code is in env CODE.
appId: com.entrenos.amigosecreto
---
# New users see the empty state; users with groups see the list header.
- tapOn:
    id: empty-join-code
    optional: true
- tapOn:
    id: join-code-button
    optional: true
- tapOn:
    id: join-code-input
- inputText: ${CODE}
- extendedWaitUntil:
    visible:
      id: invite-preview
    timeout: 15000
- tapOn:
    id: join-submit
- extendedWaitUntil:
    visible:
      id: group-screen
    timeout: 15000
- assertVisible:
    id: joined-banner
