# Happy path with three people: create → join by code ×2 → draw → reveal →
# wishlist → secret chat → receiver sees the message.
appId: com.entrenos.amigosecreto
name: Amigo secreto completo
tags:
  - e2e
---
# Organizer creates the group and copies the code.
- runFlow:
    file: subflows/dev-login.yaml
    env:
      NAME: Org E2E
- tapOn:
    id: create-group-button
    optional: true
- tapOn:
    id: empty-create-group
    optional: true
- tapOn:
    id: group-name-input
- inputText: Familia E2E
- hideKeyboard
# The budget is required (agreed by the group, never hard-coded).
- scrollUntilVisible:
    element:
      id: group-budget-input
- tapOn:
    id: group-budget-input
- inputText: '80000'
- hideKeyboard
- tapOn:
    id: group-form-submit
- extendedWaitUntil:
    visible:
      id: invite-sheet
    timeout: 15000
- copyTextFrom:
    id: invite-code
- evalScript: ${output.code = maestro.copiedText}
- back

# Two more people join with the code.
- runFlow:
    file: subflows/logout.yaml
- runFlow:
    file: subflows/dev-login.yaml
    env:
      NAME: Carlos E2E
- runFlow:
    file: subflows/join-with-code.yaml
    env:
      CODE: ${output.code}
# Carlos adds an idea to his wishlist while waiting.
- tapOn: 'Agregar ideas'
- tapOn:
    id: wishlist-add-first
- tapOn:
    id: wish-text
- inputText: Termo para el café
- tapOn:
    id: wish-size-M
- tapOn:
    id: wish-save
# The confirmation toast is short-lived (4 s) and the slow CI emulator can
# miss it; the list below is the real proof that the idea was saved.
- assertVisible:
    text: 'Idea guardada.*'
    optional: true
- tapOn:
    id: wish-done
- assertVisible: 'Termo para el café'
- back

- runFlow:
    file: subflows/logout.yaml
- runFlow:
    file: subflows/dev-login.yaml
    env:
      NAME: Ana E2E
- runFlow:
    file: subflows/join-with-code.yaml
    env:
      CODE: ${output.code}
- back

# Organizer draws.
- runFlow:
    file: subflows/logout.yaml
- runFlow:
    file: subflows/dev-login.yaml
    env:
      NAME: Org E2E
- tapOn:
    id: group-card-Familia E2E
- scrollUntilVisible:
    element:
      id: group-draw
- tapOn:
    id: group-draw
- tapOn:
    id: dialog-draw-confirm
- extendedWaitUntil:
    visible: '¡Listo! El sorteo quedó hecho.'
    timeout: 20000
- tapOn:
    id: draw-see

# S8: privacy step, then hold the gift for 1.2 s.
- tapOn:
    id: reveal-ready
- longPressOn:
    id: reveal-gift
- extendedWaitUntil:
    visible:
      id: reveal-name
    timeout: 10000
- assertVisible: 'Te tocó regalarle a'
- tapOn:
    id: reveal-chat

# S10: the name is hidden by default; write in the secret chat.
- assertVisible:
    id: friend-screen
- assertVisible: '••••••'
- tapOn:
    id: chat-input
- inputText: ¿Te gusta más el dulce o lo salado?
- tapOn:
    id: chat-send
- extendedWaitUntil:
    notVisible: 'Enviando'
    timeout: 15000
- assertVisible: '¿Te gusta más el dulce o lo salado?'
