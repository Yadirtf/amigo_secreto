name: Deploy API

on:
  push:
    branches: [main]
    paths:
      [
        'apps/api/**',
        'packages/domain/**',
        'packages/contracts/**',
        'pnpm-lock.yaml',
        '.github/workflows/deploy-api.yml',
      ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno'
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        env:
          MONGO_STAGING: ${{ secrets.MONGODB_URI_STAGING }}
          MONGO_PRODUCTION: ${{ secrets.MONGODB_URI_PRODUCTION }}
        run: |
          if [ "$TARGET" = "production" ]; then URI="$MONGO_PRODUCTION"; else URI="$MONGO_STAGING"; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$URI" ]; then
            echo "::notice::Deploy skipped: missing Cloudflare or MongoDB secrets for $TARGET (see docs/DEPLOY.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$URI"
            echo "MONGODB_URI=$URI" >> "$GITHUB_ENV"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.run == 'true'
      - name: Tests before deploy
        if: steps.check.outputs.run == 'true'
        run: pnpm test
      - name: Ensure MongoDB indexes
        if: steps.check.outputs.run == 'true'
        run: node apps/api/scripts/ensure-indexes.mjs
      - name: Deploy Worker
        if: steps.check.outputs.run == 'true'
        working-directory: apps/api
        run: |
          if [ "$TARGET" = "production" ]; then ENVFLAG="--env production"; else ENVFLAG=""; fi
          echo "ENVFLAG=$ENVFLAG" >> "$GITHUB_ENV"
          npx wrangler deploy $ENVFLAG | tee deploy.log
          grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 > url.txt
          echo "API URL: $(cat url.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Sync secrets
        if: steps.check.outputs.run == 'true'
        working-directory: apps/api
        env:
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          DEV_LOGIN_KEY: ${{ secrets.DEV_LOGIN_KEY_STAGING }}
        run: |
          EXISTING=$(npx wrangler secret list $ENVFLAG --format json 2>/dev/null | jq -r '.[].name' || true)
          put() { printf '%s' "$2" | npx wrangler secret put "$1" $ENVFLAG >/dev/null && echo "set $1"; }
          put MONGODB_URI "$MONGODB_URI"
          # Generated once and never regenerated: rotating them logs everyone out
          # (JWT) or makes stored assignments unreadable (ASSIGNMENT_KEY). See docs/DEPLOY.md.
          echo "$EXISTING" | grep -qx JWT_SECRET || put JWT_SECRET "$(openssl rand -base64 48)"
          echo "$EXISTING" | grep -qx ASSIGNMENT_KEY || put ASSIGNMENT_KEY "$(openssl rand -base64 32)"
          [ -n "$GOOGLE_CLIENT_IDS" ] && put GOOGLE_CLIENT_IDS "$GOOGLE_CLIENT_IDS"
          [ -n "$EXPO_ACCESS_TOKEN" ] && put EXPO_ACCESS_TOKEN "$EXPO_ACCESS_TOKEN"
          if [ "$TARGET" = "staging" ] && [ -n "$DEV_LOGIN_KEY" ]; then put DEV_LOGIN_KEY "$DEV_LOGIN_KEY"; fi
          true
      - name: Smoke test
        id: smoke
        if: steps.check.outputs.run == 'true'
        working-directory: apps/api
        run: |
          URL=$(cat url.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          sleep 5
          curl -fsS "$URL/health"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/v1/me")
          test "$CODE" = "401"
          echo "Smoke test OK ($URL)" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      url: ${{ steps.smoke.outputs.url }}

  preview-apk:
    name: Preview APK (staging)
    needs: deploy
    if: needs.deploy.outputs.url != '' && (github.event.inputs.environment || 'staging') == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build APK against staging
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ needs.deploy.outputs.url }}
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_DEV_LOGIN: ${{ secrets.DEV_LOGIN_KEY_STAGING != '' && '1' || '0' }}
          EXPO_PUBLIC_DEV_LOGIN_KEY: ${{ secrets.DEV_LOGIN_KEY_STAGING }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          NODE_ENV: production
        run: |
          npx expo prebuild -p android --no-install --clean
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: entre-nos-staging-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - run: du -h apps/mobile/android/app/build/outputs/apk/release/app-release.apk >> "$GITHUB_STEP_SUMMARY"
