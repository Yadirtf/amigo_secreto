name: Release Android (AAB para Play)

# Builds the signed Android App Bundle that goes to Google Play, against the
# production API. Manual: Actions → "Release Android" → Run workflow.
# Needs the upload key secrets (docs/DEPLOY.md, "Llave de subida").

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL de la API de producción'
        type: string
        default: 'https://entre-nos-api.panter.workers.dev'

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Check upload key secrets
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Faltan los secretos de la llave de subida (docs/DEPLOY.md, 'Llave de subida')."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-release
          max-size: 2G
      - run: pnpm install --frozen-lockfile
      - name: Restore upload key
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed AAB
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          # Every upload to Play needs a higher versionCode.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          NODE_ENV: production
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          npx expo prebuild -p android --no-install --clean
          cd android && ./gradlew bundleRelease --no-daemon --build-cache \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Verify signature and summary
        working-directory: apps/mobile/android/app/build/outputs
        run: |
          AAB=bundle/release/app-release.aab
          # Fails if the bundle was not signed with the upload key.
          keytool -printcert -jarfile "$AAB" | tee cert.txt
          grep -q "androiddebugkey\|CN=Android Debug" cert.txt && { echo "::error::Firmado con la llave de depuración"; exit 1; } || true
          {
            echo "### AAB listo (versionCode ${{ github.run_number }})"
            echo "- Tamaño: $(du -h "$AAB" | cut -f1)"
            echo "- API: ${{ inputs.api_url }}"
            echo "- Huellas de la llave de subida:"
            grep -E "SHA1|SHA256" cert.txt | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: entre-nos-aab-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
      # R8 renames classes; this file turns crash reports back into readable names.
      # Upload it in Play Console → App bundle explorer → (version) → Downloads.
      - uses: actions/upload-artifact@v4
        with:
          name: entre-nos-mapping-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
