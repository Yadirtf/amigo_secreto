# Signs in with the staging-only dev login (EXPO_PUBLIC_DEV_LOGIN=1).
# Usage: runFlow with env NAME.
appId: com.entrenos.amigosecreto
---
- launchApp:
    clearState: true
# A cold start after clearState can sit on the splash for 40-60 s on the
# software-rendered CI emulator (seen twice on 2026-11-27, screen still on
# the splash at 40 s, welcome shown seconds later).
- extendedWaitUntil:
    visible:
      id: dev-login-name
    timeout: 90000
- takeScreenshot: shots/${THEME}-00-welcome
- tapOn:
    id: dev-login-name
- inputText: ${NAME}
- hideKeyboard
- tapOn:
    id: dev-login-submit
- extendedWaitUntil:
    visible:
      id: groups-screen
    timeout: 20000
# The dark pass switches the app theme by hand: the phone being dark is not enough.
- runFlow:
    when:
      true: ${THEME == 'dark'}
    file: set-theme.yaml
    env:
      MODE: dark
