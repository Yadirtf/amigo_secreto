  <defs><clipPath id="enA"><circle cx="48" cy="56" r="34"/></clipPath></defs>
  <path d="M24 80 L14 100 L40 88 Z" fill="#FF7F6B"/>
  <path d="M98 80 L108 100 L82 88 Z" fill="#52C7A5"/>
  <circle cx="48" cy="56" r="34" fill="#FF7F6B"/>
  <circle cx="74" cy="56" r="34" fill="#52C7A5"/>
  <circle cx="74" cy="56" r="34" fill="#FFD166" clip-path="url(#enA)"/>
  <path d="M61 44 Q62.6 54.4 72 56 Q62.6 57.6 61 68 Q59.4 57.6 50 56 Q59.4 54.4 61 44 Z" fill="#FFFFFF"/>
